<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% if page.title %}{{ page.title }} - Shersheial Borisute{% else %}Shersheial Borisute{% endif %}</title>
    <link rel="shortcut icon" type="image/x-icon" href="{{ '/images/favicon.png' | relative_url }}">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description | truncate: 160 }}{% endif %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
    <header class="site-header">
        <div class="wrap header-inner">
            <a class="wordmark" href="{{ '/' | relative_url }}">Shersheial Borisute</a>
            <nav class="site-nav">
                <a href="{{ '/things.html' | relative_url }}"{% if page.url contains '/things' %} class="active"{% endif %}>Things</a>
                <a href="{{ '/posts/' | relative_url }}"{% if page.url contains '/posts' %} class="active"{% endif %}>Posts</a>
            </nav>
        </div>
    </header>

    <main class="wrap site-main">
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="wrap footer-inner">
            <span>&copy; 613</span>
            <nav class="footer-nav">
                <a href="mailto:contact@sharshi.com">Email</a>
                <a href="https://github.com/sharshi/" target="_blank" rel="noopener">GitHub</a>
                <a href="https://x.com/shersheial/" target="_blank" rel="noopener">X</a>
            </nav>
        </div>
    </footer>
</body>
</html>
