<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f4f5fb; color: #0f1115; font-family: Inter, system-ui, sans-serif; font-size: 15px; overflow: hidden;">

        <span style="height: 4px; border-radius: 999px; background: #d4d7dd;"></span>

    <article style="position: relative; height: 100%; box-sizing: border-box; background: #ffffff; border-radius: 24px; padding: 28px 24px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 16px 40px -24px rgba(15,17,21,0.35);">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8a4b12;">Tehillim 55:2</span>
      <p dir="rtl" style="margin: 0; font-family: 'Frank Ruhl Libre', serif; font-size: 32px; line-height: 1.6; text-align: right;">הַאֲזִינָה אֱלֹהִים תְּפִלָּתִי וְאַל תִּתְעַלַּם מִתְּחִנָּתִי</p>
      <p style="margin: 0; font-size: 17px; line-height: 1.55; color: #1f2937;">Give ear, G-d, to my prayer, and do not hide from my plea.</p>
      <a href="#" style="font-size: 14px;">Say all of 55–59 ›</a>
      <div style="margin-top: auto; display: flex; gap: 10px;">
        <a href="#" style="flex: 1; height: 50px; border-radius: 999px; border: 1.5px solid #cfd4ee; color: #383f7e; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">

          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
          Said it

    </article>
  </div>

  <p style="flex-shrink: 0; margin: 0; padding: 4px 0 26px; text-align: center; font-size: 13px; color: #4b5563; display: flex; align-items: center; justify-content: center; gap: 6px;">
