<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shafeh on a phone: the command sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4f59b8;text-decoration:none}a:hover{color:#383f7e}
</style>
<style>body{background:#f2f3f5}body>*{margin:0 auto;max-width:100vw}</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; background: #fafbfc; color: #0f1115; font-family: Inter, system-ui, sans-serif; font-size: 15px; overflow: hidden;">
  <div aria-hidden="true" style="padding: 16px; display: flex; flex-direction: column; gap: 6px;">
    <span style="font-weight: 700; font-size: 18px;">Shafeh</span>
    <span dir="rtl" style="font-family: 'Frank Ruhl Libre', serif; font-size: 20px; text-align: left;">י׳ חשון תשפ״ז</span>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(15,17,21,0.42);"></div>

  <section aria-label="Open, ask or do anything" style="position: absolute; left: 0; right: 0; bottom: 0; height: 760px; box-sizing: border-box; background: #ffffff; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(15,17,21,0.18);">
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #d4d7dd; margin: 8px 0 6px;"></div>
    <div style="padding: 4px 14px 10px; display: flex; align-items: center; gap: 8px;">
      <label for="cmd-phone" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Open, ask or do anything</label>
      <div style="flex: 1; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; background: #f2f3f5;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <input id="cmd-phone" type="text" value="shab" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 17px; background: transparent; color: #0f1115;">
      </div>
      <button type="button" style="height: 44px; padding: 0 6px; border: 0; background: transparent; font: inherit; color: #4f59b8; font-weight: 500;">Cancel</button>
    </div>

    <div style="flex: 1; min-height: 0; overflow: hidden; padding: 0 8px; display: flex; flex-direction: column; gap: 6px;">
      
        <div role="group" aria-label="Open" style="display: flex; flex-direction: column;">
          <p style="margin: 8px 10px 4px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5b6370;">Open</p>
          
            <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 10px; border-radius: 12px; color: #0f1115;">
              <span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: #f2f3f5; color: #374151; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 012-2h5v18H6a2 2 0 01-2-2zM13 3h5a2 2 0 012 2v14a2 2 0 01-2 2h-5z"></path></svg></span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
                <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Shabbos 31a</span>
                <span style="font-size: 13px; color: #5b6370; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Gemara</span>
              </span>
              <span dir="rtl" style="font-family: 'Frank Ruhl Libre', serif; color: #4b5563;">שבת לא.</span>
            </a>
          
            <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 10px; border-radius: 12px; color: #0f1115;">
              <span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: #f2f3f5; color: #374151; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 012-2h5v18H6a2 2 0 01-2-2zM13 3h5a2 2 0 012 2v14a2 2 0 01-2 2h-5z"></path></svg></span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
                <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Hilchos Shabbos</span>
                <span style="font-size: 13px; color: #5b6370; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Rambam</span>
              </span>
              <span dir="rtl" style="font-family: 'Frank Ruhl Libre', serif; color: #4b5563;">הלכות שבת</span>
            </a>
          
        </div>
      
        <div role="group" aria-label="Ask Ana Avda" style="display: flex; flex-direction: column;">
          <p style="margin: 8px 10px 4px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5b6370;">Ask Ana Avda</p>
          
            <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 10px; border-radius: 12px; color: #0f1115;">
              <span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: #e7e9f6; color: #383f7e; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg></span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
                <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Shabbos candle lighting time</span>
                <span style="font-size: 13px; color: #5b6370; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">[Your city]</span>
              </span>
              <span dir="rtl" style="font-family: 'Frank Ruhl Libre', serif; color: #4b5563;"></span>
            </a>
          
        </div>
      
        <div role="group" aria-label="Tools" style="display: flex; flex-direction: column;">
          <p style="margin: 8px 10px 4px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5b6370;">Tools</p>
          
            <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 10px; border-radius: 12px; color: #0f1115;">
              <span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: #f2f3f5; color: #374151; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v5l3 2M12 21a9 9 0 100-18 9 9 0 000 18z"></path></svg></span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
                <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Zmanim</span>
                <span style="font-size: 13px; color: #5b6370; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Friday: candle lighting 5:40 PM</span>
              </span>
              <span dir="rtl" style="font-family: 'Frank Ruhl Libre', serif; color: #4b5563;"></span>
            </a>
          
        </div>
      
        <div role="group" aria-label="Actions" style="display: flex; flex-direction: column;">
          <p style="margin: 8px 10px 4px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5b6370;">Actions</p>
          
            <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 10px; border-radius: 12px; color: #0f1115;">
              <span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: #e6f2ee; color: #25624d; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
                <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Mark Rambam learned</span>
                <span style="font-size: 13px; color: #5b6370; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Rotzeach 8–10</span>
              </span>
              <span dir="rtl" style="font-family: 'Frank Ruhl Libre', serif; color: #4b5563;"></span>
            </a>
          
        </div>
      
    </div>
  </section>
</div>
</body>
</html>
